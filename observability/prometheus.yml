# Prometheus scrape configuration (owner: Member A).
# Targets owned by Members B/C (spark-streaming, api) simply show as DOWN until their
# service exists - that is also what triggers the StreamingQueryStopped / ApiDown alerts.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: vitals-simulator
    static_configs:
      - targets: ["vitals-simulator:8001"]

  - job_name: lab-generator
    static_configs:
      - targets: ["lab-generator:8002"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Member B: StreamingQueryListener metrics (contract 4.7)
  - job_name: spark-streaming
    static_configs:
      - targets: ["spark-streaming:8003"]

  # Member C: FastAPI /metrics
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Short-lived jobs (Airflow tasks, batch Spark) push here; honor_labels keeps their own job label.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
